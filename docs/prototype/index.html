function content(){if(page==='scope')return scopeView();if(page==='scan')return scanView();if(page==='executing')return executionView();if(page==='result')return resultView();if(page==='recovery')return recoveryView();if(page==='space')return spaceView();return listView()}
function visible(){return items.filter(x=>!x.done&&!!x.cache===(page==='caches')&&(!query||(x.group+' '+x.name+' '+x.path).toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='large'&&x.size>=1||filter==='old'&&x.age>=90||filter==='protected'&&(x.blocked||kept.has(x.id)))).sort((a,b)=>sort==='age'?b.age-a.age:sort==='name'?a.group.localeCompare(b.group):b.size-a.size)}
function listView(){let t=totals(),v=visible(),groups=[...new Set(v.map(x=>x.group))],unready=scanState==='cancelled'||scanState==='idle';return header(page==='caches'?'应用与缓存':'给项目留出呼吸的空间',page==='caches'?'按应用查看用途与影响。聊天记录和个人资料保持原位。':'先看项目，再选产物。每一项都能单独保留。',`<button onclick="nav('scope')">扫描范围 ↗</button>`)+metrics(t.now,t.recovery)+`<div class="notice ${unready?'':'neutral'}">${unready?'扫描未完成，当前结果仅供查看。重新扫描完成后才能清理。':'◉　本次扫描有 1 个目录无法读取，未计入结果。其他已验证条目可以单独处理。'}<button class="link" onclick="${unready?'startScan()':'permissionDialog()'}">${unready?'重新扫描':'查看详情'}</button></div><div class="toolbar"><input id="search" type="text" value="${esc(query)}" placeholder="搜索项目、产物或路径…" aria-label="搜索项目、产物或路径" oninput="searchChange(this)"><select aria-label="筛选" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>全部条目</option><option value="large" ${filter==='large'?'selected':''}>大于 1 GB</option><option value="old" ${filter==='old'?'selected':''}>闲置 90 天以上</option><option value="protected" ${filter==='protected'?'selected':''}>已保护 / 保留</option></select><select aria-label="排序" onchange="sort=this.value;render()"><option value="size" ${sort==='size'?'selected':''}>按体积排序</option><option value="age" ${sort==='age'?'selected':''}>按闲置时间</option><option value="name" ${sort==='name'?'selected':''}>按项目名称</option></select><button onclick="selectVisible()" ${unready?'disabled':''}>选择当前结果</button></div><div class="workarea"><div class="list"><div class="listhead"><span>${v.length} 个产物 · ${groups.length} 个${page==='caches'?'应用':'项目'}</span><span>已选 ${selected.size} 项 · 当前视图外 ${items.filter(x=>selected.has(x.id)&&!v.includes(x)).length} 项</span></div>${groups.map(g=>{let a=v.filter(x=>x.group===g),eligible=a.filter(x=>!x.blocked&&!kept.has(x.id));return `<div class="group row"><input type="checkbox" data-parent="${g}" aria-label="选择 ${g} 当前可见产物" ${eligible.length&&eligible.every(x=>selected.has(x.id))?'checked':''} ${!eligible.length||unready?'disabled':''} onchange="toggleGroup('${g}',this.checked)"><span class="folder">▱</span><div class="grow"><strong>${g}</strong><br><small>${page==='caches'?'已识别的应用与工具':'~/Projects/'+g} · ${a[0].age} 天前活跃</small></div><small>${fmt(a.reduce((n,x)=>n+x.size,0))}</small></div>${a.map(x=>`<div class="artifact ${focusId===x.id?'focus':''}"><input type="checkbox" aria-label="选择 ${g} ${x.name}" ${selected.has(x.id)?'checked':''} ${x.blocked||kept.has(x.id)||unready?'disabled':''} onchange="toggleItem('${x.id}',this.checked)"><button class="name" onclick="focusId='${x.id}';render()"><strong class="mono">${x.name}</strong><small>${x.blocked?'不提供清理':kept.has(x.id)?'已加入长期保留':x.action==='command'?'原生命令 · 不可撤销':'移入恢复区 · 可还原'}</small></button><span class="tag ${x.blocked?'amber':'green'}">${kept.has(x.id)?'始终保留':x.tier}</span><span class="size">${fmt(x.size)}</span></div>`).join('')}`}).join('')||'<div class="empty">没有匹配的条目<br>试试其他关键词或筛选条件</div>'}</div>${detailView()}</div>`}
function detailView(){let x=items.find(x=>x.id===focusId)||items[0];return `<aside class="details"><div class="row between"><span class="fileicon">${x.cache?'◈':'▱'}</span><span class="tag">条目详情</span></div><h3>${x.name}</h3><small>${x.group}</small><div class="path mono">${x.path}</div><div class="detailsection"><h4>是什么 / 清理影响</h4><p>${x.desc}</p></div><div class="detailsection"><h4>${x.blocked?'为什么被保护':'判断依据'}</h4><p>${x.evidence}</p>${!x.blocked?'<div class="checkline">✓ 已完成扫描检查</div><div class="checkline">↻ 执行前会再次复核</div>':''}</div><div class="detailsection"><button class="link" onclick="pathDialog('${x.id}')">查看完整路径 ↗</button>${!x.blocked?`<br><button class="link" onclick="keep('${x.id}')">${kept.has(x.id)?'取消长期保留':'始终保留此项'}</button>`:''}</div></aside>`}
function searchChange(el){let pos=el.selectionStart;query=el.value;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)}
function toggleItem(id,v){v?selected.add(id):selected.delete(id);render()}
function toggleGroup(g,v){visible().filter(x=>x.group===g&&!x.blocked&&!kept.has(x.id)).forEach(x=>v?selected.add(x.id):selected.delete(x.id));render()}
function selectVisible(){visible().filter(x=>!x.blocked&&!kept.has(x.id)).forEach(x=>selected.add(x.id));render()}
function keep(id){if(kept.has(id)){kept.delete(id);toast('已取消长期保留，未自动勾选')}else{kept.add(id);selected.delete(id);toast('已保留：本次演示的重新扫描仍会记住这个决定')}render()}
function footer(){if(['projects','caches'].includes(page)){let t=totals();return `<footer class="footer"><div><strong>已选 ${selected.size} 项</strong><small>立即释放约 ${fmt(t.now)} · 移入恢复区 ${fmt(t.recovery)}</small></div><button class="link" onclick="selected.clear();render()">清空选择</button><button class="primary" onclick="confirmClean()" ${!selected.size||['idle','cancelled'].includes(scanState)?'disabled':''}>查看清理确认单 →</button></footer>`}return `<footer class="footer"><small>演示模式 · 所有操作只改变此页面的模拟状态</small><button class="link" style="margin-left:auto" onclick="showMode('flow')">查看交互流程 ↗</button></footer>`}
function scopeView(){return header('从你熟悉的目录开始','明确扫描范围。添加目录不会解除系统保护，也不会自动清理。')+`<div class="panel"><div class="row between"><h3>项目目录</h3><button onclick="addScope()">＋ 添加模拟目录</button></div>${scope.map((s,i)=>`<div class="scope-row"><span class="scopeicon">▱</span><div class="grow"><strong>${s.split('/').pop()}</strong><div class="path mono">${esc(s)}</div></div><span class="tag green">本次扫描</span><button class="icon" aria-label="移除 ${esc(s)}" onclick="scope.splice(${i},1);scanState='idle';render()">×</button></div>`).join('')||'<div class="empty">请添加至少一个目录</div>'}</div><div class="panel"><h3>长期保留 <span class="tag">${kept.size} 项</span></h3><p class="subtitle">仍可显示占用，但不会进入清理选择。本次演示中跨重新扫描保留。</p>${items.filter(x=>kept.has(x.id)).map(x=>`<div class="scope-row"><div class="grow"><strong>${x.group} / ${x.name}</strong><div class="path mono">${x.path}</div></div><button onclick="keep('${x.id}')">取消保留</button></div>`).join('')||'<p class="subtitle">暂未设置。在条目详情中点击「始终保留此项」。</p>'}</div><div class="notice neutral">系统、凭据、聊天记录保持保护。无法读取的目录会单独报告，不会算作 0 GB。</div><div class="row between"><small>目录更改后，必须重新扫描才能生成方案</small><button class="primary" onclick="startScan()" ${scope.length?'':'disabled'}>开始模拟扫描 →</button></div>`}
function addScope(){modal('添加扫描目录','这是原型中的模拟路径，不打开系统文件选择器。',`<label class="stack" style="margin-top:20px">目录路径<input id="scopeInput" type="text" value="~/Workspaces" aria-label="模拟扫描路径"></label>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveScope()">添加</button>`)}
function saveScope(){let v=document.getElementById('scopeInput').value.trim();if(!/^(~\/|\/)/.test(v)||v.includes('..')||v==='/'||v==='~/'||v.length>180){toast('请输入具体的模拟工作目录，如 ~/Workspaces');return}if(!scope.includes(v))scope.push(v);scanState='idle';closeModal();render()}
function startScan(){if(!scope.length){nav('scope');toast('请先添加扫描目录');return}clearInterval(scanTimer);selected.clear();scanStage=0;scanState='running';page='scan';closeModal();render();scanTimer=setInterval(()=>{scanStage++;if(scanStage>=4){clearInterval(scanTimer);scanState='partial'}render()},1000)}
function scanView(){let steps=['发现项目与应用缓存','计算占用与重建信息','检查用户内容与保护规则','整理结果与不可读目录'];return header(scanState==='running'?'正在认识你的工作空间':'扫描结束，结果已分开说明',scanState==='running'?'发现的条目会逐步出现。所有检查完成前不能执行清理。':'1 个目录未能读取。已验证结果可查看，未读取内容未计入。',`<span class="tag green">模拟扫描</span>`)+`<div class="panel"><div class="row between"><h3>${scanState==='running'?steps[Math.min(scanStage,3)]:'已验证 7 项 · 1 个目录不可读'}</h3><span class="mono muted">${Math.min(scanStage*25,100)}%</span></div><div class="progress"><i style="width:${Math.min(scanStage*25,100)}%"></i></div><small class="mono">${esc(scope[0])} / ${scanStage<2?'atlas-web':'research-api'}</small>${steps.map((s,i)=>`<div class="scanline"><span class="n">${i<scanStage?'✓':i+1}</span><div class="grow">${s}<small>${i<scanStage?'已完成':i===scanStage?'进行中 · 条目仅供查看':'等待前一步'}</small></div>${i===3&&scanStage>=4?'<span class="tag amber">1 个不可读</span>':''}</div>`).join('')}</div>${scanStage>0?`<div class="notice neutral">已发现 atlas-web${scanStage>1?'、research-api、chain-demo':''}。${scanState==='running'?'正在验证，暂不可勾选。':'chain-demo/target 含密钥，已保护。'}</div>`:''}<div class="row between">${scanState==='running'?'<button onclick="cancelScan()">取消扫描</button><button onclick="finishScan()">快进演示</button>':'<button onclick="permissionDialog()">查看不可读目录</button><button class="primary" onclick="enterResults()">查看已验证结果 →</button>'}</div>`}
function cancelScan(){clearInterval(scanTimer);scanState='cancelled';page='projects';render();toast('扫描已取消，保留只读示例，不允许执行清理')}
function finishScan(){clearInterval(scanTimer);scanStage=4;scanState='partial';render()}
function enterResults(){selected=new Set(items.filter(x=>['next','modules','venv','npm'].includes(x.id)&&!kept.has(x.id)&&!x.done).map(x=>x.id));page='projects';render()}
function permissionDialog(){modal('有一个目录未能读取','它不在本次结果和空间估算中，已验证的其他条目仍可处理。',`<div class="panel" style="margin-top:20px"><h3>Archive（模拟目录）</h3><p class="subtitle mono">~/PycharmProjects/Archive</p><p class="subtitle">原因：访问权限不足<br>占用：未能测得</p></div><p class="subtitle">正式产品应按真实原因提供权限指引，不会把所有读取失败都归因于完全磁盘访问权限。</p>`,`<button onclick="closeModal()">知道了</button><button class="primary" onclick="closeModal();startScan()">模拟重新扫描</button>`)}
function pathDialog(id){let x=items.find(x=>x.id===id);modal('条目位置',x.group+' / '+x.name,`<div class="panel mono" style="margin-top:20px;word-break:break-all">${esc(x.path)}</div><p class="subtitle">正式应用可在 Finder 定位。原型不会访问这个路径。</p>`,`<button class="primary" onclick="closeModal()">关闭</button>`)}
function confirmClean(){if(!selected.size||['cancelled','idle','running'].includes(scanState))return;let arr=items.filter(x=>selected.has(x.id)&&!x.done),t=totals(arr);selectedSnapshot=arr.map(x=>({...x}));modal('确认这次清理','执行前会再次检查。变化、被占用或受保护的项将跳过。',`<div class="summary"><div><small>预计立即释放 · 不可撤销</small><strong>${fmt(t.now)}</strong></div><div><small>移入恢复区 · 保留 7 天</small><strong>${fmt(t.recovery)}</strong></div></div><div class="notice neutral">移入恢复区不会立即腾出空间。到期只提醒，由你确认清空。</div>${arr.map(x=>`<div class="minirow"><span>${x.group} / ${x.name}<small style="display:block;margin-top:4px">${x.action==='command'?'原生命令清理，无法撤销':'移入恢复区，可还原'}</small></span><span>${fmt(x.size)}</span></div>`).join('')}<label class="ack"><input type="checkbox" id="ack" onchange="updateConfirm()">我已了解不可撤销操作与恢复区仍占空间的区别。</label>${arr.some(x=>x.id==='cursor')?'<label class="ack"><input type="checkbox" id="quitAck" onchange="updateConfirm()">模拟：已保存工作并自行退出 Cursor。</label>':''}<div class="detailsection scenario"><span>演示分支</span><select id="scenario" aria-label="复核演示场景" onchange="scenario=this.value"><option value="changed" ${scenario==='changed'?'selected':''}>.venv 执行前发生变化</option><option value="ok" ${scenario==='ok'?'selected':''}>所有选中项复核通过</option></select></div>`,`<button onclick="closeModal()">返回调整</button><button class="primary" id="runButton" onclick="runClean()" disabled>确认并模拟执行</button>`)}
function updateConfirm(){document.getElementById('runButton').disabled=!document.getElementById('ack').checked||!!document.getElementById('quitAck')&&!document.getElementById('quitAck').checked}
let runIndex=0;function runClean(){if(document.getElementById('runButton').disabled)return;closeModal();runResults=[];runIndex=0;page='executing';render();advanceRun()}
function advanceRun(){runTimer=setTimeout(()=>{let x=selectedSnapshot[runIndex];if(!x){page='result';selected.clear();render();return}let skipped=scenario==='changed'&&x.id==='venv';runResults.push({...x,status:skipped?'skipped':'done'});if(!skipped){items.find(i=>i.id===x.id).done=true;if(x.action==='recover')records.push({...x,state:'stored'})}runIndex++;render();advanceRun()},550)}
function executionView(){return header('先复核，再处理','已完成的操作不会因停止而回滚；剩余项将保持原位。')+`<div class="panel"><div class="row between"><h3>${runIndex<selectedSnapshot.length?'正在复核 '+selectedSnapshot[runIndex].group+' / '+selectedSnapshot[runIndex].name:'正在整理结果'}</h3><small>${runIndex} / ${selectedSnapshot.length}</small></div><div class="progress"><i style="width:${runIndex/selectedSnapshot.length*100}%"></i></div><div class="result-list">${runResults.map(x=>`<div class="entry"><span class="tag ${x.status==='skipped'?'amber':'green'}">${x.status==='skipped'?'已跳过':'已完成'}</span><div>${x.group} / ${x.name}<small>${x.status==='skipped'?'目录状态与扫描时不一致，保留原位':'模拟操作完成'}</small></div></div>`).join('')}</div></div><button onclick="stopRun()">停止后续操作</button>`}
function stopRun(){clearTimeout(runTimer);selectedSnapshot.slice(runIndex).forEach(x=>runResults.push({...x,status:'stopped'}));selected.clear();page='result';render()}
function resultView(){let done=runResults.filter(x=>x.status==='done'),t=totals(done),skipped=runResults.filter(x=>x.status!=='done');return `<div class="intro"><div class="bigcheck">✓</div><h1>这次清理，处理情况都在这里。</h1><p class="subtitle">${done.length} 项完成 · ${skipped.length} 项保留原位　/　模拟结果</p></div><div class="metrics"><div class="metric"><div class="label">卷可用空间增加</div><div class="number" style="color:var(--green)">${(t.now*.92).toFixed(1)}<span>GB</span></div><small>前后观测值 · 模拟数据</small></div><div class="metric"><div class="label">已移入恢复区</div><div class="number">${t.recovery.toFixed(1)}<span>GB</span></div><small>仍占空间 · 可还原</small></div><div class="metric"><div class="label">保持原位</div><div class="number">${skipped.length}<span>项</span></div><small>未改变这些条目</small></div></div><p class="subtitle" style="margin-bottom:18px">可用空间变化会受其他程序写入影响，不等于本工具独立释放的精确值。</p><div class="panel result-list">${runResults.map(x=>`<div class="entry"><span class="tag ${x.status==='done'?'green':'amber'}">${x.status==='done'?'完成':x.status==='stopped'?'已停止':'已跳过'}</span><div class="grow">${x.group} / ${x.name}<small>${x.status==='skipped'?'执行前发现目录状态变化，未处理；重新扫描后再决定':x.status==='stopped'?'尚未执行，保持原位':x.action==='command'?'原生命令已模拟完成，不能还原':'可在恢复区还原，7 天后到期'}</small></div><span>${fmt(x.size)}</span></div>`).join('')||'<p class="muted">还没有执行记录。先从项目清理开始体验。</p>'}</div><div class="row between"><button onclick="startScan()">重新扫描</button><button class="primary" onclick="nav('recovery')">查看恢复区 →</button></div>`}
function recoveryView(){let live=records.filter(x=>x.state==='stored');return header('历史与恢复','清理之后也有退路。到期不会自动删除，清空需要再次确认。',`<span class="tag">P2 交互预览</span>`)+`<div class="metrics"><div class="metric"><div class="label">恢复区条目占用</div><div class="number">${live.reduce((n,x)=>n+x.size,0).toFixed(1)}<span>GB</span></div><small>不等于清空后必然释放量</small></div><div class="metric"><div class="label">保留时间</div><div class="number">7<span>天</span></div><small>本次批次 · 模拟</small></div><div class="metric"><div class="label">仍可还原</div><div class="number">${live.length}<span>项</span></div><small>还原不会覆盖现有内容</small></div></div><div class="panel"><div class="row between"><h3>本次模拟清理</h3><button onclick="purgeDialog()" ${live.length?'':'disabled'}>永久清空此批…</button></div>${records.map(x=>`<div class="recoveryrow"><span class="fileicon">▱</span><div class="grow"><strong>${x.group} / ${x.name}</strong><small class="mono">${x.path}</small></div><span>${fmt(x.size)}</span>${x.state==='stored'?`<button onclick="restoreDialog('${x.id}')">还原</button>`:`<span class="tag">${x.state==='restored'?'已还原':x.state==='alternate'?'已另存恢复':'已永久清空'}</span>`}</div>`).join('')||'<div class="empty">恢复区还是空的。<br>完成一次模拟清理后，这里会出现可还原的项目。<br><button class="link" onclick="nav(\'projects\')">去选择清理项 →</button></div>'}</div>${runResults.some(x=>x.action==='command')?'<div class="notice neutral">原生命令清理保留操作记录，但没有恢复副本。</div>':''}`}
function restoreDialog(id){let x=records.find(x=>x.id===id);modal('还原 '+x.group+' / '+x.name,'选择一个分支，看看恢复遇到冲突时如何处理。',`<div class="panel mono" style="margin-top:20px">${x.path}</div><p class="subtitle">正常还原会回到原位置。如果原位置已有内容，则拒绝覆盖。</p>`,`<button onclick="restoreConflict('${id}')">模拟原位置冲突</button><button class="primary" onclick="restoreDone('${id}',false)">模拟正常还原</button>`)}
function restoreConflict(id){modal('原位置已有新内容','已停止还原，现有文件与恢复副本都保持不变。',`<div class="notice" style="margin-top:20px">不会覆盖或合并两个目录。</div><p class="subtitle">P2 提案：可以选择其他空位置接收恢复副本。</p>`,`<button onclick="closeModal()">暂不还原</button><button class="primary" onclick="restoreDone('${id}',true)">模拟还原到新位置</button>`)}
function restoreDone(id,alt){let x=records.find(x=>x.id===id);x.state=alt?'alternate':'restored';if(!alt)items.find(i=>i.id===id).done=false;closeModal();render();toast(alt?'模拟：已另存到 ~/Recovered，不覆盖原位置':'模拟：已还原到原位置')}
function purgeDialog(){modal('永久清空这批恢复副本？','清空后无法通过清理大师还原。',`<div class="notice" style="margin-top:20px">这是不可撤销操作。此原型仅模拟状态变化，不删除任何文件。</div><p class="subtitle">共享数据块可能影响最终释放量，正式产品应在操作后显示观测结果。</p><label class="ack"><input id="purgeAck" type="checkbox" onchange="document.getElementById('purgeButton').disabled=!this.checked">我理解这些恢复副本将无法找回。</label>`,`<button onclick="closeModal()">保留副本</button><button id="purgeButton" class="danger" disabled onclick="purgeDone()">模拟永久清空</button>`)}
function purgeDone(){records.filter(x=>x.state==='stored').forEach(x=>x.state='purged');closeModal();render();toast('模拟清空完成；原型没有访问真实文件')}
let spaceDepth=0;function spaceView(){let rows=spaceDepth?[['atlas-web',16],['research-api',9],['chain-demo',4],['其他项目',7]]:[['Projects',36],['应用缓存',18],['本地模型',25],['恢复区',8]];return header('看清空间去了哪里','先定位占用，再决定是否处理。大目录不会自动成为清理推荐。','<span class="tag">P2 只读预览</span>')+`<div class="breadcrumb"><button class="link" onclick="spaceDepth=0;render()">Macintosh HD</button><span>›</span><button class="link" onclick="spaceDepth=0;render()">用户目录</button>${spaceDepth?'<span>›</span><span>Projects</span>':''}</div><div class="notice neutral">只读空间浏览 · 这里的统计与主流程为独立模拟数据，用于展示下钻交互。</div><div class="panel">${rows.map(([n,s],i)=>`<div class="spaceentry"><span>▱　${n}</span><div class="spacebar"><i style="width:${s/40*100}%;background:${['#73977b','#91aa8c','#b3bfa0','#d0d8bd'][i]}"></i></div><span>${fmt(s)}</span><button class="icon" aria-label="查看 ${n}" onclick="${!spaceDepth&&i===0?'spaceDepth=1;render()':`spaceInfo('${n}',${s})`}">›</button></div>`).join('')}</div><div class="row between"><small>选择目录只改变浏览位置，不会加入清理方案。</small><button onclick="nav('projects')">回到项目清理 →</button></div>`}
function spaceInfo(n,s){modal(n+' · '+fmt(s),'空间浏览只提供定位，不授权清理。','<p class="subtitle" style="margin-top:22px">正式产品将在这里展示下一层目录。此处展示交互层级，未接入磁盘索引。</p>',`<button onclick="closeModal()">返回</button><button class="primary" onclick="closeModal();nav('projects')">查看规则识别的产物</button>`)}
function jump(p){mode='app';if(p==='scan'){startScan();return}if(p==='confirm'){page='projects';render();confirmClean();if(!selected.size)toast('先勾选一个可清理条目');return}nav(p)}
function modal(title,sub,body,actions){previousFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row between"><h2 id="modalTitle">${esc(title)}</h2><button class="icon" onclick="closeModal()" aria-label="关闭对话框">×</button></div><p class="subtitle">${esc(sub)}</p>${body}<div class="actions">${actions}</div></section></div>`;document.querySelector('.modal button')?.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus()}
document.addEventListener('keydown',e=>{let m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){let a=[...m.querySelectorAll('button:not(:disabled),input,select,a[href]')],first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function toast(s){clearTimeout(toastTimer);document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3400)}
resetDemo();
</script></body></html>
