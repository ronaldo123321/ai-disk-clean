<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc">
<title id="title">清理大师下一版交互流程</title><desc id="desc">从扫描范围到扫描、产物选择、确认、执行复核及恢复，包含权限不足、取消、状态变化和恢复冲突分支。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#88a18c" stroke-width="1.2"/></marker><style>text{font-family:'PingFang SC','Helvetica Neue',sans-serif;fill:#26372c}.title{font-size:18px;font-weight:600}.sub{font-size:13px;fill:#778777}.small{font-size:11px;fill:#819080}.num{font-size:12px;fill:#397150;font-weight:600}.line{fill:none;stroke:#91a48e;stroke-width:1.6;marker-end:url(#arrow)}.branch{fill:none;stroke:#b9a57c;stroke-width:1.4;stroke-dasharray:5 5;marker-end:url(#arrow)}.box{fill:white;stroke:#dbe3d6;stroke-width:1.2}.warning{fill:#faf5e9;stroke:#e6d9bd}.green{fill:#edf5e9;stroke:#c7d8c1}</style></defs>
<rect width="1440" height="770" rx="12" fill="#fcfdf9"/>
<text x="35" y="40" font-size="12" fill="#809078" letter-spacing="2">P0 / P1 · 主操作路径</text>
<path class="line" d="M251 133H282"/><path class="line" d="M485 133H516"/><path class="line" d="M719 133H750"/><path class="line" d="M953 133H984"/><path class="line" d="M1187 133H1218"/>
<g transform="translate(35 75)"><rect class="box" width="216" height="124" rx="11"/><text class="num" x="18" y="27">01 / SCOPE</text><text class="title" x="18" y="56">选择扫描范围</text><text class="sub" x="18" y="83">工作目录 · 长期保留</text><text class="sub" x="18" y="104">范围变化 → 旧方案失效</text></g>
<g transform="translate(285 75)"><rect class="box" width="200" height="124" rx="11"/><text class="num" x="18" y="27">02 / SCAN</text><text class="title" x="18" y="56">渐进扫描</text><text class="sub" x="18" y="83">先发现，再测量与验证</text><text class="sub" x="18" y="104">未验证条目只读</text></g>
<g transform="translate(519 75)"><rect class="green" width="200" height="124" rx="11"/><text class="num" x="18" y="27">03 / SELECT</text><text class="title" x="18" y="56">按项目选择产物</text><text class="sub" x="18" y="83">搜索 · 排序 · 父子选择</text><text class="sub" x="18" y="104">安全依据与影响可查看</text></g>
<g transform="translate(753 75)"><rect class="box" width="200" height="124" rx="11"/><text class="num" x="18" y="27">04 / REVIEW</text><text class="title" x="18" y="56">清理确认单</text><text class="sub" x="18" y="83">立即释放 ≠ 移入恢复区</text><text class="sub" x="18" y="104">确认不可撤销项与退出应用</text></g>
<g transform="translate(987 75)"><rect class="box" width="200" height="124" rx="11"/><text class="num" x="18" y="27">05 / RECHECK</text><text class="title" x="18" y="56">逐项复核与执行</text><text class="sub" x="18" y="83">归属 · 身份 · 用户内容</text><text class="sub" x="18" y="104">通过后处理，并记录结果</text></g>
<g transform="translate(1221 75)"><rect class="green" width="184" height="124" rx="11"/><text class="num" x="17" y="27">06 / RESULT</text><text class="title" x="17" y="56">查看真实结果</text><text class="sub" x="17" y="83">可用空间变化</text><text class="sub" x="17" y="104">恢复区占用 · 跳过原因</text></g>
<path class="branch" d="M385 199V255"/><path class="branch" d="M619 199V255"/><path class="branch" d="M1087 199V255"/>
<g transform="translate(285 259)"><rect class="warning" width="200" height="126" rx="10"/><text class="title" x="16" y="29" style="font-size:15px">权限不足 / 扫描取消</text><text class="sub" x="16" y="56">未知不记作 0 GB</text><text class="sub" x="16" y="79">保留状态与原因</text><text class="small" x="16" y="104">重新扫描；取消结果不可执行</text></g>
<g transform="translate(519 259)"><rect class="warning" width="200" height="126" rx="10"/><text class="title" x="16" y="29" style="font-size:15px">命中保护 / 长期保留</text><text class="sub" x="16" y="56">源码、密钥、历史会话</text><text class="sub" x="16" y="79">显示占用，但禁用选择</text><text class="small" x="16" y="104">长期保留跨重新扫描生效</text></g>
<g transform="translate(987 259)"><rect class="warning" width="200" height="126" rx="10"/><text class="title" x="16" y="29" style="font-size:15px">状态变化 / 无法验证</text><text class="sub" x="16" y="56">跳过该项，保持原位</text><text class="sub" x="16" y="79">其他通过项继续</text><text class="small" x="16" y="104">审计不可用时停止后续动作</text></g>
<path class="branch" d="M1187 322H1313V203"/>
<path class="line" d="M853 199V222H729V145H724"/><text class="small" x="771" y="241">返回调整</text>
<text x="35" y="440" font-size="12" fill="#809078" letter-spacing="2">P2 · 理解空间与清理之后</text>
<path class="line" d="M1313 199V451H837V475"/>
<g transform="translate(35 479)"><rect class="box" width="370" height="178" rx="11"/><text class="num" x="20" y="29">独立入口 / 只读空间浏览</text><text class="title" x="20" y="61">目录列表 → 下钻 → 查看归属</text><text class="sub" x="20" y="92">面包屑、体积排序与占比条</text><text class="sub" x="20" y="117">目录很大，不代表应该清理</text><text class="sub" x="20" y="147">回到规则识别的产物，重新选择与确认</text></g>
<g transform="translate(519 479)"><rect class="green" width="360" height="178" rx="11"/><text class="num" x="20" y="29">历史 / 恢复区</text><text class="title" x="20" y="61">按清理批次查看与还原</text><text class="sub" x="20" y="92">原位置、体积、剩余保留天数、状态</text><text class="sub" x="20" y="117">7 天到期只提醒，不自动删除</text><text class="sub" x="20" y="147">原生命令清理只有历史，没有恢复副本</text></g>
<path class="line" d="M879 526H983"/><path class="line" d="M879 609H983"/>
<g transform="translate(987 479)"><rect class="box" width="418" height="76" rx="10"/><text class="title" x="18" y="28" style="font-size:15px">还原 → 检查原位置</text><text class="sub" x="18" y="53">无冲突：还原　/　有冲突：保留两份，另选位置</text></g>
<g transform="translate(987 578)"><rect class="warning" width="418" height="79" rx="10"/><text class="title" x="18" y="29" style="font-size:15px">永久清空 → 二次确认 → 记录结果</text><text class="sub" x="18" y="55">明确不可恢复；报告操作后的空间观测变化</text></g>
<path d="M35 700H1405" stroke="#e1e8da"/><text class="sub" x="35" y="732">设计原则：看得见范围 · 选得准产物 · 未知不当安全 · 恢复与释放分开说明</text><text class="small" x="1130" y="732">交互提案 · 所有分支均为拟议行为</text>
</svg>
